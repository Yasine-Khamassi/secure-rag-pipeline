name: rag controls
on:
  push:
    paths: ["**", "!findings/out/**"]
  pull_request:
  workflow_dispatch:
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
